<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bikes2Beans - Saved Routes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --ui-text: #2f2218;
      --ui-muted: #5a4a3c;
      --ui-input-bg: #fbf6f1;
      --ui-input-border: #e8d5c2;
      --ui-hover-border: #c19370;
      --brand: #9a6f4d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ui-text);
    }

    .saved-route-page {
      position: relative;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-image: ;
      background-size: cover;
      background-position: center;
    }

    .topbar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.01em;
      color: #fff;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.4);
    }

    .active-route-label {
      font-size: 0.84rem;
      color: #3b2d22;
      background: rgba(255, 248, 240, 0.9);
      border: 1px solid rgba(243, 224, 208, 0.9);
      border-radius: 999px;
      padding: 7px 12px;
      max-width: min(62vw, 500px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-stack {
      position: absolute;
      bottom: 14px;
      left: 14px;
      z-index: 25;
      display: grid;
      gap: 9px;
      width: min(92vw, 370px);
      max-height: min(72vh, 660px);
      overflow-y: auto;
      padding-right: 6px;
    }

    .route-stack::-webkit-scrollbar {
      width: 8px;
    }

    .route-stack::-webkit-scrollbar-thumb {
      background: rgba(245, 232, 216, 0.7);
      border-radius: 999px;
    }

    .route-card {
      border-radius: 0.75rem;
      border: 1px solid var(--ui-input-border);
      padding: 0.75rem 1rem;
      width: 308px;
      background: rgba(255, 252, 248, 0.9);
      backdrop-filter: blur(3px);
      position: relative;
      text-align: left;
      cursor: pointer;
      font: inherit;
      transition: width 190ms ease, min-height 190ms ease, border-color 190ms ease,
        background-color 190ms ease;
    }

    .route-card:hover {
      border-color: var(--ui-hover-border);
    }

    .route-card.active {
      width: 360px;
      min-height: 186px;
      background: var(--ui-input-bg);
      border-color: var(--brand);
    }

    .route-card-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .route-card-meta {
      margin-top: 2px;
      font-size: 0.88rem;
      color: var(--ui-muted);
    }

    .route-divider {
      margin-top: 12px;
      height: 1px;
      background: color-mix(in oklab, var(--ui-input-border) 70%, #fff);
    }

    .route-summary {
      margin-top: 8px;
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: color-mix(in oklab, var(--ui-muted) 88%, #fff);
    }

    .route-details {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 220ms ease, opacity 180ms ease, margin-top 180ms ease;
      margin-top: 0;
    }

    .route-card.active .route-details {
      max-height: 220px;
      opacity: 1;
      margin-top: 10px;
    }

    .route-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
      font-size: 0.84rem;
    }

    .route-k {
      color: var(--ui-muted);
    }

    .route-v {
      font-weight: 600;
    }

    .route-stops {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--ui-muted);
      line-height: 1.35;
    }

    .preview-note {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 30;
      max-width: min(86vw, 420px);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 242, 226, 0.8);
      background: rgba(55, 40, 30, 0.45);
      color: #fff6ef;
      font-size: 0.8rem;
    }

    @media (max-width: 860px) {
      .route-stack {
        left: 10px;
        right: 10px;
        width: auto;
        max-height: 48vh;
      }

      .route-card,
      .route-card.active {
        width: 100%;
      }

      .topbar {
        right: 10px;
        left: 10px;
        gap: 8px;
        align-items: flex-start;
        flex-direction: column;
      }

      .topbar h1 {
        font-size: 1.06rem;
      }
    }
  </style>
</head>

<body>
  <main class="saved-route-page">
    <img src="grrr.jpg" alt="">
    <div class="topbar">
      <h1>Saved Routes</h1>
      <div id="active-route-label" class="active-route-label">Select a route</div>
    </div>

    <section id="route-stack" class="route-stack"></section>

    <p class="preview-note">
      Preview mockup using a static cycling photo background. Replace sample route data as needed.
    </p>
  </main>

  <script>
    const savedRoutes = [
      {
        id: "sunrise-river-loop",
        name: "Sunrise River Loop",
        distance: "19.4 km",
        duration: "58 min",
        difficulty: "Moderate",
        elevationGain: "212 m",
        pace: "2:59 /km",
        stops: ["Bluebird Roasters", "Riverstone Cafe", "Oak & Bean"],
      },
      {
        id: "hill-climb-espresso",
        name: "Hill Climb Espresso",
        distance: "24.1 km",
        duration: "1h 22m",
        difficulty: "Hard",
        elevationGain: "463 m",
        pace: "3:24 /km",
        stops: ["Summit Press", "The Switchback", "Foundry Coffee"],
      },
      {
        id: "downtown-flat-white",
        name: "Downtown Flat White",
        distance: "13.2 km",
        duration: "42 min",
        difficulty: "Easy",
        elevationGain: "96 m",
        pace: "3:10 /km",
        stops: ["Civic Grounds", "Third Street Drip", "Velvet Roast"],
      },
    ];

    const routeStack = document.getElementById("route-stack");
    const activeRouteLabel = document.getElementById("active-route-label");

    let activeRouteId = savedRoutes[0].id;

    function formatRouteMeta(route) {
      return `${route.distance} | ${route.duration} | ${route.difficulty}`;
    }

    function renderRouteCards() {
      routeStack.innerHTML = "";

      savedRoutes.forEach((route) => {
        const isActive = route.id === activeRouteId;
        const card = document.createElement("button");
        card.type = "button";
        card.className = `route-card${isActive ? " active" : ""}`;
        card.setAttribute("data-route-id", route.id);

        card.innerHTML = `
            <p class="route-card-title">${route.name}</p>
            <div class="route-card-meta">${formatRouteMeta(route)}</div>
            <div class="route-divider"></div>
            <div class="route-summary">${route.stops.length} coffee stops</div>
            <div class="route-details">
              <div class="route-grid">
                <span class="route-k">Elevation Gain</span>
                <span class="route-v">${route.elevationGain}</span>
                <span class="route-k">Avg Pace</span>
                <span class="route-v">${route.pace}</span>
              </div>
              <div class="route-stops">Stops: ${route.stops.join(" | ")}</div>
            </div>
          `;

        card.addEventListener("click", () => {
          activeRouteId = route.id;
          activeRouteLabel.textContent = `${route.name} - ${route.distance} - ${route.duration}`;
          renderRouteCards();
        });

        routeStack.appendChild(card);
      });
    }

    activeRouteLabel.textContent = `${savedRoutes[0].name} - ${savedRoutes[0].distance} - ${savedRoutes[0].duration}`;
    renderRouteCards();
  </script>
</body>

</html>
